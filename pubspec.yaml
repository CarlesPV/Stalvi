name: stalvi
description: A local-first financial application.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management
  flutter_riverpod: ^3.3.2

  # Database & ORM
  drift: ^2.14.1
  sqlcipher_flutter_libs: ^0.7.0+eol # Required for SQLCipher encryption

  # Security & Storage
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2

  # Charts & UI
  fl_chart: ^1.2.0
  intl: ^0.20.0 # For currency and date formatting

  # Export, Import & Files
  pdf: ^3.11.1
  path_provider: ^2.1.1

  file_picker: ^12.0.0-beta.7
  encrypt: ^5.0.3
  crypto: ^3.0.3
  open_filex: ^4.5.0

  # Network API (For Currency Exchange)
  http: ^1.2.1

  # Utils
  uuid: ^4.3.3

  path: any
  sqlite3: any
  local_auth_android: any
  local_auth_darwin: any
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  workmanager: ^0.10.7
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_local_notifications: ^17.2.3
  riverpod_annotation: any
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  mocktail: ^1.0.5

  mockito: ^5.4.6

  local_auth_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

dependency_overrides:
  path_provider_android: 2.2.14
