name: stalvi
description: A local-first financial application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management
  flutter_riverpod: ^2.4.9

  # Database & ORM
  drift: ^2.14.1
  sqlcipher_flutter_libs: ^0.5.7 # Required for SQLCipher encryption

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # Charts & UI
  fl_chart: ^0.65.0
  intl: ^0.20.0 # For currency and date formatting

  # Export, Import & Files
  pdf: ^3.11.1
  path_provider: ^2.1.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  open_filex: ^4.5.0

  # Network API (For Currency Exchange)
  http: ^1.2.1

  # Utils
  uuid: ^4.3.3

  path: any
  sqlite3: any
  local_auth_android: any
  local_auth_darwin: any
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7
  mocktail: ^1.0.5

  mockito: ^5.4.6

  local_auth_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"