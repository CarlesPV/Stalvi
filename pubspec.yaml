name: konta
description: A local-first financial application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management
  flutter_riverpod: ^2.4.9

  # Database & ORM
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  sqlcipher_flutter_libs: ^0.5.7 # Required for SQLCipher encryption

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  flutter_dotenv: ^5.1.0

  # Charts & UI
  fl_chart: ^0.65.0
  intl: ^0.20.0 # For currency and date formatting

  # Export, Import & Files
  pdf: ^3.11.1
  printing: ^5.13.0
  csv: ^6.0.0
  excel: ^4.0.3
  path_provider: ^2.1.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2

  # Network API (For Currency Exchange)
  http: ^1.2.1

  # Utils
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - .env