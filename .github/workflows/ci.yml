name: Stalvi Flutter CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java for Android build
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate dummy .env file for CI
        run: |
          echo "DB_ENCRYPTION_KEY=ci_dummy_encryption_key_12345" >> .env
          echo "EXCHANGE_RATE_API_KEY=ci_dummy_api_key_12345" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code (Linting)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test