name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Execute every Sunday at midnight
  pull_request:
    branches: [ main ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate dummy .env file for security scan
        run: |
          echo "DB_ENCRYPTION_KEY=ci_dummy_encryption_key_12345" >> .env
          echo "EXCHANGE_RATE_API_KEY=ci_dummy_api_key_12345" >> .env

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 1. Dart/Flutter native dependency vulnerability scanning
      - name: Audit Dart Dependencies
        run: dart pub outdated --transitive --dependency-overrides --no-dev-dependencies
        
      # 2. Advanced Static Analysis (Linter configuration covers most security practices)
      - name: Run Flutter Analyze
        run: flutter analyze
          
      - name: Remove dummy .env file for Trivy scan
        run: rm -f .env
          
      # 3. Trivy: file system and container scanner (looks for exposed secrets, etc.)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'